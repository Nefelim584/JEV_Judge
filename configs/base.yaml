# Shared experiment config. Stack files (apple_silicon.yaml, cuda.yaml) may only
# override `runtime`, `env`, `tuning.mode` and `train.per_device_batch_size`.

seed: 42

model:
  base: answerdotai/ModernBERT-large
  init: base              # base (model.base from the Hub) | laya (Laya's encoder, TODO section 7; heads start fresh) | checkpoint (encoder + heads of an earlier stage)
  laya_checkpoint: base   # base | typed-decisions (multilingual is mmBERT-base, not ModernBERT-large)
  init_checkpoint: null   # init: checkpoint → a save_final folder (encoder + heads), local or hub:<owner>/<repo>/<folder>
  readout: marker         # marker ([MASK] in packed mode, [CLS] in pair mode) | mean (pair mode only)
  decision_layers: 0      # > 0: Laya-style transformer layers before the read-out (ablation)
  trunk_dim: 256
  dropout: 0.1

encoding:
  mode: packed            # packed (one sequence per question, [MASK] markers) | pair (one per candidate, ablation)
  max_len: 512
  head_ratio: 0.5         # share of the state token budget kept from the head; the rest comes from the tail

tuning:
  mode: lora              # lora | full
  lora:
    r: 16
    alpha: 32
    dropout: 0.1
    target_modules: [Wqkv, Wo, Wi]

train:
  effective_batch_size: 32
  per_device_batch_size: 8
  lr:
    lora: 2.0e-4
    full: 3.0e-5
    heads: null               # trunk + heads in their own group at this LR; null = one group at the encoder LR (Stage A)
  warmup_ratio: 0.06
  schedule: linear        # linear | cosine
  weight_decay: 0.01
  gradient_checkpointing: true
  max_grad_norm: 1.0
  num_workers: 2              # DataLoader workers (tokenisation overlaps the GPU)
  log_every_steps: 50
  eval_every_steps: 1000
  eval_splits: [dev]          # periodic eval; recipe choices are made on it (todo, Stage A review, Q1)
  final_splits: [test_in, test_ood]   # predictions on all records after the last step; never in the periodic eval
  eval_max_records: {bool: 1000, choice: 1000, score: 500}   # periodic eval subset per split and primitive
  checkpoint:
    every_minutes: 40
    keep: 2                   # newest checkpoints kept, locally and on the Hub
    hub_repo: Nefelim584/jevlite-runs   # private; null = local only. Token: HF_TOKEN
  stage_a:
    max_len: 512
    epochs: 2                 # train.e0.jsonl, train.e1.jsonl of the mix
    mix: mixes/stage_a.yaml   # relative to configs/; built by scripts/build_mix.py
                              # no-SA version: mixes/stage_a_nosa.yaml (experiment override)
  stage_b:
    max_len: 1024
    epochs: 2                 # train.e0.jsonl, train.e1.jsonl of the mix
    mix: mixes/stage_b.yaml   # built on Kaggle CPU by notebooks/kaggle/06_build_stage_b.ipynb (todo Phase 4b)
    # starts from Stage A: --set model.init=checkpoint
    #   --set model.init_checkpoint=hub:Nefelim584/jevlite-runs/stage_a-full-s42/final

loss:
  weights: {choice: 1.0, score: 1.0, bool: 1.0}
  emd_lambda: 0.5
  brier_mu: 0.1

runtime:
  device: auto            # auto | mps | cuda | cpu
  precision: auto         # auto | fp32 | fp16 | bf16
  attn_implementation: auto   # auto | sdpa | eager | flash_attention_2
  optimizer: adamw        # adamw | adamw_8bit

env: {}
