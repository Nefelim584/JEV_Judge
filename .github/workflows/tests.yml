name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tag for setup-uv
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # CPU-only torch: the CUDA wheels are several GB and the tests do not need a GPU.
      - name: Install
        run: uv pip install --torch-backend cpu -e ".[reports]" pytest

      # The tests load only the ModernBERT tokenizer (a few MB), never the weights.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizer-modernbert-large

      - name: Test
        run: python -m pytest -q
